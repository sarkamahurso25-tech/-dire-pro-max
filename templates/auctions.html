<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dire Pro Max - Active Auctions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #333; font-family: sans-serif; }
        .top-header { background-color: #0f763e; color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .auction-grid { row-gap: 18px; }
        .card-custom {
            background: #ffffff;
            color: #263238;
            border: 1px solid #e5eee9;
            border-radius: 13px;
            padding: 12px;
            margin-bottom: 0;
            height: 100%;
            box-shadow: 0 3px 12px rgba(15, 118, 62, 0.09);
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .card-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(15, 118, 62, 0.16);
        }
        .item-img {
            width: 100%;
            height: 175px;
            object-fit: contain;
            background: #f7faf8;
            border-radius: 9px;
            margin-bottom: 10px;
        }
        .card-custom h4 { font-size: 16px; margin-bottom: 7px; }
        .card-custom p { font-size: 12px; margin-bottom: 7px; }
        .card-custom .fs-5 { font-size: 13px !important; }
        .card-custom .btn { font-size: 13px; padding: 8px 5px; border: 0; background: #1769D2; }
        .card-custom .btn:hover { background: #1255ad; }

        @media (max-width: 575.98px) {
            .top-header { font-size: 18px; padding: 12px 5px; }
            .container { padding-left: 10px; padding-right: 10px; }
            .item-img { height: 125px; }
            .card-custom { padding: 9px; border-radius: 10px; }
            .card-custom h4 { font-size: 14px; }
            .card-custom p { font-size: 11px; }
            .card-custom .btn { font-size: 12px; }
        }
    
        .item-img { cursor: zoom-in; }
        .image-preview[hidden] { display: none !important; }
        .image-preview {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(0,0,0,.94);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 16px; gap: 16px;
        }
        .image-preview img {
            display: block; max-width: 96vw; max-height: 78vh;
            width: auto; height: auto; object-fit: contain;
            border-radius: 8px;
        }
        .image-preview-actions {
            display: flex; gap: 14px; justify-content: center;
        }
        .image-preview-actions a,
        .image-preview-actions button {
            min-width: 115px; padding: 11px 22px;
            border: 0; border-radius: 9px;
            font-size: 16px; font-weight: bold;
            text-decoration: none; text-align: center;
        }
        .image-preview-save { background: #198754; color: white; }
        .image-preview-back { background: white; color: #222; }

    </style>
</head>
<body>

    <div class="top-header shadow-sm">
        DIRE PRO MAX - ACTIVE AUCTIONS
    </div>

    <div class="container my-4">
        <a href="{{ url_for('home') }}" class="btn btn-secondary mb-4">&larr; Back to Home</a>
        
        <div class="row">
            <h3 class="mb-4 text-dark fw-bold">Live Auctions</h3>
            {% for item in auctions %}
            <div class="col-6 col-md-4 col-lg-3">
                <div class="card card-custom">
                    <img src="{{ item.image if item.image.startswith('https://') else url_for('static', filename='uploads/' + item.image) }}" class="item-img" title="Tap to view full image" alt="{{ item.title }}">
                    
                    <h4 class="fw-bold">{{ item.title }}</h4>
                    <p class="text-muted">Auction Code: <strong>{{ item.code }}</strong></p>
                    <p class="text-success fw-bold">Bid Service Fee: {{ item.fee }} Br</p>
                    
                    <p class="text-danger fw-bold fs-5">
                        ⏱️ Time Remaining: <span id="timer-{{ loop.index }}" data-time="{{ item.remaining_seconds }}">Calculating...</span>
                    </p>
                    
                    <p class="text-primary fw-bold">{{ item.bids_count }} Bids</p>
                    <a href="{{ url_for('auction_detail', item_id=item.id) }}" class="btn btn-warning w-100 fw-bold text-white">Bid Now</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Meeshaalee hundaaf timer jalqabsiisuu
            document.querySelectorAll("[id^='timer-']").forEach(function(timerEl) {
                let secondsLeft = parseInt(timerEl.getAttribute("data-time")) || 864000;
                
                function updateTimer() {
                    if (secondsLeft <= 0) {
                        timerEl.innerHTML = "EXPIRED";
                        return;
                    }
                    let days = Math.floor(secondsLeft / (3600 * 24));
                    let hours = Math.floor((secondsLeft % (3600 * 24)) / 3600);
                    let minutes = Math.floor((secondsLeft % 3600) / 60);
                    let seconds = Math.floor(secondsLeft % 60);

                    timerEl.innerHTML = `${days}d : ${hours.toString().padStart(2, '0')}h : ${minutes.toString().padStart(2, '0')}m : ${seconds.toString().padStart(2, '0')}s`;
                    secondsLeft--;
                }
                updateTimer();
                setInterval(updateTimer, 1000);
            });
        });
    </script>

    <div id="imagePreview" class="image-preview" hidden
         role="dialog" aria-modal="true" aria-label="Image preview">
        <img id="imagePreviewFull" src="" alt="Product image">
        <div class="image-preview-actions">
            <a id="imagePreviewSave" class="image-preview-save" href="#" download>Save</a>
            <button id="imagePreviewBack" class="image-preview-back" type="button">Back</button>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const preview = document.getElementById("imagePreview");
        const fullImage = document.getElementById("imagePreviewFull");
        const saveLink = document.getElementById("imagePreviewSave");
        const backButton = document.getElementById("imagePreviewBack");

        document.querySelectorAll(".item-img").forEach(function (img) {
            img.addEventListener("click", function () {
                const source = img.currentSrc || img.src;
                fullImage.src = source;
                fullImage.alt = img.alt || "Product image";

                // Cloudinary attachment flag helps the browser download the image.
                let downloadUrl = source;
                if (source.includes("/image/upload/")) {
                    downloadUrl = source.replace(
                        "/image/upload/",
                        "/image/upload/fl_attachment/"
                    );
                }

                saveLink.href = downloadUrl;
                saveLink.download = "dire-pro-max-product-image";
                preview.hidden = false;
                document.body.style.overflow = "hidden";
            });
        });

        function closePreview() {
            preview.hidden = true;
            fullImage.src = "";
            document.body.style.overflow = "";
        }

        backButton.addEventListener("click", closePreview);

        preview.addEventListener("click", function (event) {
            if (event.target === preview) closePreview();
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && !preview.hidden) {
                closePreview();
            }
        });
    });
    </script>

</body>
</html>
