<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dire Pro Max - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#ffffff; font-family:sans-serif; }
        .login-card { max-width:420px; margin:10vh auto; background:white;
            padding:30px; border-radius:15px; box-shadow:0 4px 15px #0002; }
        .login-title { background:#0f763e; color:white; padding:18px;
            text-align:center; border-radius:10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card">
        <div class="login-title mb-4">
            <h4 class="fw-bold mb-0">DIRE PRO MAX ADMIN</h4>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Admin Phone</label>
                <input type="text" name="phone" class="form-control"
                       required autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control"
                       required autocomplete="current-password">
            </div>
            <button class="btn btn-success w-100 fw-bold">Login</button>
        </form>
        <a href="{{ url_for('home') }}" class="btn btn-link w-100 mt-2">Back to Home</a>
    </div>
</div>
</body>
</html>
