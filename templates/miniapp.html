<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#092b25">
    <title>DIRE PRO MAX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/miniapp.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/miniapp">
            <span class="brand-mark">DP</span>
            <span>DIRE PRO <b>MAX</b></span>
        </a>
        <div class="header-actions">
            <span class="live-label"><i></i> LIVE AUCTIONS</span>

        </div>
    </header>

    <main class="container">
        <section class="welcome-screen" id="welcome-screen">
            <div class="welcome-content">
                <div class="welcome-mark">DP</div>
                <span class="welcome-eyebrow">WELCOME TO</span>
                <h1>DIRE PRO <span>MAX</span></h1>
                <p>Discover · Bid · Win</p>
                <button type="button" class="start-bidding-btn" id="start-bidding">
                    START BIDDING
                </button>
            </div>
        </section>

        <section id="marketplace" hidden>
        <section class="section-heading" id="auction-list">
            <div>
                <span class="eyebrow">LIVE MARKETPLACE</span>
                <h2>Active auctions</h2>
            </div>
            <span class="count" id="auction-count">Loading...</span>
        </section>

        <div id="message" class="message">Loading auctions...</div>
        <section class="auction-grid" id="auctions"></section>
        </section>
    </main>

    <footer>
        <b>DIRE PRO MAX</b>
        <span>Discover · Bid · Win</span>
    </footer>

    <script src="{{ url_for('static', filename='js/miniapp.js') }}"></script>
</body>
</html>
